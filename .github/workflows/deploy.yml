name: Deploy Application to Docker Container

on:
  push:
    branches:
      - main
      - feature/new-grade-criteria

jobs:
  # 核心任务：构建Docker镜像并推送到Docker Hub（这就是"部署到Docker容器"）
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout code from GitHub
        uses: actions/checkout@v4

      - name: 2. Set up Docker build environment
        uses: docker/setup-qemu-action@v3

      - name: 3. Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 4. Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: 5. Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: wyj1018/234-deploylab-backend:latest
